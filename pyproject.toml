[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I", "DJ"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501", "I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
exclude = ["**/migrations/*.py"]
