# Validates every pull request into dev or main. A single `make verify` runs
# Ruff (lint and format), the Django system checks, the migration check and the
# whole test suite under coverage.py with a 90% line gate.
#
# On pushes to dev or main it also publishes the SonarQube Cloud analysis, which
# reuses coverage.xml generated by the previous step. SonarQube Cloud follows the
# GitHub default branch, which is dev: that is the project's main branch and the
# one shown on the Overview dashboard.
#
# Requirements before the SonarQube step can run:
# - Organization secret SONAR_TOKEN with a SonarQube Cloud token (Dariosoft org,
#   Actions secrets, shared with this repository).
# - Automatic Analysis disabled for the fes-panel-api project: SonarQube Cloud
#   rejects CI-based analysis while it is enabled.
#
# Dependency vulnerabilities and secrets are reported, not enforced yet: set
# exit-code to '1' on the Trivy steps to fail the job on findings.
#
# The local secret guard is the versioned pre-commit hook in .githooks: enable it
# with `git config core.hooksPath .githooks`.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify panel-api
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint, Django checks, migrations and coverage
        run: make verify

      - name: Generate SBOM
        run: cyclonedx-py environment -o bom.json

      - name: Dependency vulnerability report (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: sbom
          scan-ref: bom.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '0'

      - name: Secret scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: '0'
          skip-dirs: .git,.venv,__pycache__

      - name: SonarQube Cloud analysis
        #if: github.ref == 'refs/heads/main'
        uses: SonarSource/sonarqube-scan-action@v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
